name: Health
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: make artifact
        run: |
          mkdir -p output
          printf '## PR Health\n\nFORK-20c02bc164ab — attacker-controlled bot comment via fork PR\n\n[@dart-lang/sdk-team](https://example.invalid/phish2)\n' > output/comment.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: output
          path: output/
